name: Update predictions

# Scrapes FPL, retrains the model and exports the static prediction feed.
# - schedule / manual run on main: commits the new feed, which triggers a Vercel deploy
# - pull requests touching the pipeline: runs everything as a check, commits nothing

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Gameweek to export (blank = next gameweek per FPL)"
        required: false
        default: ""
  pull_request:
    paths:
      - "scraper/**"
      - "backend/**"
      - "ml/**"
      - ".github/workflows/update-predictions.yml"

permissions:
  contents: write

concurrency:
  group: update-predictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            backend/requirements.txt
            ml/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt -r backend/requirements.txt -r ml/requirements.txt

      - name: Scrape FPL API
        run: python scraper/main.py

      - name: Load into SQLite
        run: python -m backend.etl

      - name: Train model
        run: python ml/train.py

      - name: Export feed
        env:
          GAMEWEEK: ${{ github.event.inputs.gameweek }}
        run: python ml/export_predictions.py $GAMEWEEK

      - name: Validate feed
        run: python ml/validate_feed.py

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("frontend/data/predictions/latest.json"))
          m = d.get("model") or {}
          print(f"## GW{d['gameweek']} ({d['season']}): {len(d['predictions'])} players, {len(d['injured_players'])} flagged")
          print(f"Deadline {d['deadline_time']}. Test MAE {m.get('test_mae')} vs baseline {m.get('baseline_mae_avg_last_5')} ({m.get('split')} split, {m.get('n_train')} train rows)\n")
          print("| # | Player | Team | Pos | Opp | Pts |\n|---|---|---|---|---|---|")
          for i, p in enumerate(d["predictions"][:15], 1):
              print(f"| {i} | {p['web_name']} | {p['team']} | {p['position']} | {p['opponent']} | {p['predicted_points']} |")
          EOF

      - name: Upload feed (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: prediction-feed
          path: |
            frontend/data/predictions/
            ml/metrics.json

      - name: Commit feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add frontend/data/predictions
          if git diff --cached --quiet; then
            echo "Feed unchanged; nothing to commit."
            exit 0
          fi
          label=$(python -c "import json; d=json.load(open('frontend/data/predictions/manifest.json')); print(f\"GW{d['latest_gameweek']} ({d['season']})\")")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update predictions for $label"
          git pull --rebase origin main
          git push origin HEAD:main
